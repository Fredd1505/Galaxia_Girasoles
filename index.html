<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de girasoles</title>
    
    
    
    
    
    <link rel="stylesheet" href="style.css">
    <!-- Three.js r128 ya incluye FontLoader y TextGeometry. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <div class="cielo" id="cielo-estrellas">
        <div class="luna"></div>
    </div>

    <div id="cargando">
        <div class="contenido-cargando">
            <h2>Cargando</h2><span id="puntos-cargando"></span>
            <div class="texto-progreso" id="texto-progreso">0%</div>
        </div>
    </div>
    
    <div id="contenedor-escena"></div>
    
    <div id="superposicion-ui">
        <button id="alternar-audio">OFF</button>
        <div id="indicador-toque"></div>
        <div id="instrucciones">Toca la pantalla y deja florecer la galaxia 🌻 </div>
        <div class="galeria">
            <button type="button" class="elemento-galeria" data-indice="0" aria-label="Abrir mensaje 1"><span aria-hidden="true">🌻</span></button>
            <button type="button" class="elemento-galeria" data-indice="1" aria-label="Abrir mensaje 2"><span aria-hidden="true">🌻</span></button>
            <button type="button" class="elemento-galeria" data-indice="2" aria-label="Abrir mensaje 3"><span aria-hidden="true">🌻</span></button>
            <button type="button" class="elemento-galeria" data-indice="3" aria-label="Abrir mensaje 4"><span aria-hidden="true">🌻</span></button>
        </div>
    </div>

    <div id="modal-imagen" class="modal">
        <button type="button" class="boton-cerrar" aria-label="Cerrar mensaje">&times;</button>
        <div class="contenido-modal" id="imagen-modal" aria-hidden="true">🌻</div>
        <div class="mensaje-modal" id="mensaje-modal"></div>
    </div>

    <audio id="audio-fondo" src="Musica.mp3" preload="none" loop></audio>

    
</body>
</html>
